        execution: { kind: mcp, server: spaces-learning }
      learning.chapter.open:
        tool: learning_chapter_open
        required_params: [course_id, chapter_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.session.start:
        tool: learning_session_start
        required_params: [course_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.task.next:
        tool: learning_task_next
