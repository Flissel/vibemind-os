        required_params: [eingabe]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: auftragsbuch }
      sales.post_offen:
        tool: sales_post_offen
        required_params: [eingabe]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: auftragsbuch }
      sales.auftrag_probe:
