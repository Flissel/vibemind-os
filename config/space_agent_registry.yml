# VibeMind Space→Agent→Tools Registry
# Single source of truth for: event_type → space → agent → mcp_scope → tool_hint
#
# Used by:
#   - voice/python/swarm/routing/space_agent_registry.py (Python loader)
#   - scripts/sync_openfang_agents.py (generates openfang/agents/brain-*/agent.toml)
#
# Schema: version 1

version: 1

defaults:
  fallback_agent: brain-fallback
  default_context_fields: [current_space, session_id, conversation_turns]
  openfang_url: http://localhost:4200
  voice_timeout_s: 1.5

spaces:

  # ─── Bubbles (canvas CRUD) ─────────────────────────────────────────
  bubbles:
    agent: brain-bubbles
    # Legacy input spelling only. Persisted/routed identity stays "bubbles".
    aliases: [shuttles]
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [bubble.]
    enabled: true
    description: "Bubble CRUD + navigation on the VibeMind canvas."
    mcp_servers: [vibemind-db, vibemind, spaces-ideas]
    # M5 2026-08-07: ohne mcp_tools bekommt der Agent KEINE MCP-Tools —
    # der Generator leitet die tools-Liste nur hieraus ab, nicht aus
    # mcp_servers (fail-closed by design, sync_openfang_agents.py:86;
    # im Daemon-Log belegt: tool_names waren nur memory_store/-recall).
    # Bewusst minimal: genau die drei Operationen, die bubble_promote
    # braucht (Idee lesen, Projekt anlegen, Idee als promoted markieren).
    mcp_tools:
      spaces-ideas: [bubble_create]
      vibemind-db: [db_ideas_get, db_ideas_update, db_projects_create]
    system_prompt_hint: "You manage bubbles (idea clusters) on the VibeMind canvas. Use the preferred_tool hint in the intent envelope; only call other tools if the hint fails."
    default_context: [current_space, current_bubble, idea_count]
    events:
      bubble.list:              { tool: vibemind_bubbles,       required_params: [] }
      bubble.create:
        tool: bubble_create
        required_params: [title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      bubble.enter:             { tool: vibemind_bubble_enter,  required_params: [bubble_name] }
      bubble.exit:              { tool: vibemind_bubble_exit,   required_params: [] }
      bubble.back:              { tool: vibemind_bubble_exit,   required_params: [] }
      bubble.delete:            { tool: db_ideas_delete,        required_params: [bubble_name] }
      bubble.delete_all_except: { tool: db_ideas_delete,        required_params: [keep_name] }
      bubble.update:            { tool: vibemind_bubble_update, required_params: [bubble_id] }
      bubble.find:              { tool: vibemind_bubbles,       required_params: [query] }
      bubble.stats:             { tool: vibemind_bubbles,       required_params: [] }
      bubble.score:             { tool: vibemind_bubbles,       required_params: [bubble_id] }
      bubble.evaluate:          { tool: vibemind_bubble_update, required_params: [bubble_id] }
      bubble.promote:           { tool: vibemind_bubble_update, required_params: [bubble_id] }
      bubble.current:           { tool: vibemind_bubbles,       required_params: [] }

  # ─── Ideas (notes inside bubbles) ───────────────────────────────────
  ideas:
    agent: brain-ideas
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [idea.]
    enabled: true
    description: "Idea notes inside bubbles — create, update, link, format."
    mcp_servers: [vibemind-db, spaces-ideas]
    mcp_tools: { spaces-ideas: [idea_connect] }
    default_context: [current_space, current_bubble, idea_titles]
    events:
      idea.list:                { tool: db_ideas_list,   required_params: [] }
      idea.create:              { tool: db_ideas_create, required_params: [title] }
      idea.update:              { tool: db_ideas_update, required_params: [idea_id] }
      idea.delete:              { tool: db_ideas_delete, required_params: [idea_id] }
      idea.find:                { tool: db_ideas_list,   required_params: [query] }
      idea.connect:
        tool: idea_connect
        required_params: [from_id, to_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.auto_link:           { tool: db_canvas_edge_create, required_params: [] }
      idea.add_image:           { tool: db_ideas_update, required_params: [idea_id] }
      idea.current_space:       { tool: db_ideas_list,   required_params: [] }
      idea.format_table:        { tool: db_ideas_update, required_params: [idea_id] }
      idea.format_note:         { tool: db_ideas_update, required_params: [idea_id] }
      idea.format_action_list:  { tool: db_ideas_update, required_params: [idea_id] }
      idea.format_pros_cons:    { tool: db_ideas_update, required_params: [idea_id] }
      idea.format_hierarchy:    { tool: db_ideas_update, required_params: [idea_id] }
      idea.format_specs:        { tool: db_ideas_update, required_params: [idea_id] }
      idea.convert_format:      { tool: db_ideas_update, required_params: [idea_id] }
      idea.summarize:           { tool: db_ideas_update, required_params: [idea_id] }
      idea.whitepaper:          { tool: db_ideas_update, required_params: [idea_id] }
      idea.expand:              { tool: db_ideas_update, required_params: [idea_id] }
      idea.explain:             { tool: db_ideas_list,   required_params: [idea_id] }
      idea.analyze_links:       { tool: db_canvas_nodes, required_params: [] }
      idea.explore.start:       { tool: db_ideas_update, required_params: [] }
      idea.explore.stop:        { tool: db_ideas_update, required_params: [] }
      idea.generate_doc:        { tool: db_ideas_update, required_params: [idea_id] }
      idea.to_project:          { tool: db_projects_create, required_params: [name] }

  # ─── Coding (code gen + edits) ──────────────────────────────────────
  coding:
    agent: brain-coder
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [code.]
    enabled: true
    description: "Code generation, editing, testing, review."
    mcp_servers: [vibemind-db, filesystem, git, github, context7, qdrant, fetch, brain, issue-detector]
    default_context: [current_space, recent_intents]
    events:
      code.generate:      { tool: "coding-engine:POST:/api/start", required_params: [description] }
      code.modify:        { tool: "coding-engine:POST:/api/start", required_params: [description, file_path] }
      code.status:        { tool: "coding-engine:GET:/api/status", required_params: [] }
      code.show:          { tool: "coding-engine:GET:/api/logs", required_params: [] }
      code.preview.start: { tool: "coding-engine:POST:/api/preview/create", required_params: [project_id, project_path] }
      code.preview.stop:  { tool: "coding-engine:POST:/api/preview/{project_id}/stop", required_params: [project_id] }
      code.list:          { tool: "coding-engine:GET:/api/preview/", required_params: [] }
      code.cancel:        { tool: "coding-engine:POST:/api/stop", required_params: [] }

  # ─── Desktop automation ─────────────────────────────────────────────
  desktop:
    agent: brain-desktop
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [desktop., web., messaging., openclaw.]
    keywords: ["screenshot|bildschirm|klick|browser|click"]
    enabled: true
    description: "Desktop/window automation via pyautogui/moire."
    mcp_servers: [vibemind-db, desktop-automation]
    default_context: [current_space, active_window]
    events:
      desktop.open_app:       { tool: desktop_open_app,    required_params: [app_name], requires_confirmation: true, result_validation: external_receipt }
      desktop.click:          { tool: desktop_click,       required_params: [element], requires_confirmation: true, result_validation: external_receipt }
      desktop.type:           { tool: desktop_type,        required_params: [text], requires_confirmation: true, result_validation: external_receipt }
      desktop.press_key:      { tool: desktop_press_key,   required_params: [key], requires_confirmation: true, result_validation: external_receipt }
      desktop.screenshot:     { tool: desktop_screenshot,  required_params: [] }
      desktop.scroll:         { tool: desktop_scroll,      required_params: [direction], requires_confirmation: true, result_validation: external_receipt }
      desktop.task:           { tool: desktop_task,        required_params: [task], requires_confirmation: true, result_validation: external_receipt }
      desktop.task.create:    { tool: desktop_task,        required_params: [task], requires_confirmation: true, result_validation: external_receipt }
      desktop.task.update:    { tool: desktop_task,        required_params: [task_id], requires_confirmation: true, result_validation: external_receipt }
      desktop.task.list:      { tool: desktop_task,        required_params: [] }
      desktop.moire.scan:     { tool: desktop_screenshot,  required_params: [] }
      desktop.moire.find:     { tool: desktop_screenshot,  required_params: [query] }
      messaging.whatsapp:     { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      messaging.telegram:     { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      messaging.send:         { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      web.search:             { tool: fetch,               required_params: [query] }
      web.fetch:              { tool: fetch,               required_params: [url] }
      openclaw.status:        { tool: desktop_task,        required_params: [] }
      openclaw.notifications: { tool: desktop_task,        required_params: [] }
      openclaw.prompt:        { tool: desktop_task,        required_params: [prompt], requires_confirmation: true, result_validation: external_receipt }
      openclaw.browse:        { tool: fetch,               required_params: [url] }
      openclaw.scrape:        { tool: fetch,               required_params: [url] }
      openclaw.screenshot.web: { tool: desktop_screenshot, required_params: [url] }
      openclaw.fill_form:     { tool: desktop_type,        required_params: [form_data], requires_confirmation: true, result_validation: external_receipt }
      openclaw.message.send:  { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      openclaw.message.read:  { tool: desktop_task,        required_params: [] }
      openclaw.linkedin.search: { tool: fetch, required_params: [query] }
      openclaw.monitor:       { tool: desktop_task,        required_params: [] }

  # ─── Research (web + ideas) ─────────────────────────────────────────
  research:
    agent: brain-researcher
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [research.]
    enabled: true
    description: "Web research + summarization into ideas."
    # E9: Die Schreib-Events laufen über spaces-ideas statt über den breiten
    # vibemind-db-Server. Nach dem Umbinden bindet kein Event mehr ein
    # vibemind-db-Tool, darum entfällt der Server hier ganz.
    # qdrant bleibt ohne mcp_tools-Eintrag — Server-Scope ohne abgeleitete
    # Capability, wie im Bubbles-Block bei `vibemind`.
    mcp_servers: [fetch, spaces-ideas, qdrant]
    # M5 2026-08-07 / E10: ohne mcp_tools bekommt der Agent KEINE MCP-Tools —
    # der Generator leitet die tools-Liste nur hieraus ab, nicht aus
    # mcp_servers (fail-closed by design, sync_openfang_agents.py:86).
    # Genau daran war dieser Space bisher nicht ausführbar: alle sechs Events
    # banden auf Werkzeuge, die das Manifest nie führte.
    # Bewusst minimal: genau die Werkzeuge, die die Events oben binden.
    mcp_tools:
      fetch: [fetch]
      spaces-ideas: [idea_create, idea_update]
    # E10: Recherche-Last (ganze Seiten aus fetch, Mehrquellen-Synthese in
    # openclaw.compare) sprengt gpt-4o-mini/4096. gpt-4o ist in
    # models_pricing.yml gepflegt, bleibt provider=openai und hebt das
    # Ausgabelimit auf sein Maximum.
    model: { model: gpt-4o, max_tokens: 16384 }
    default_context: [current_space, current_bubble]
    events:
      research.web:         { tool: fetch, required_params: [query] }
      research.scrape:      { tool: fetch, required_params: [url] }
      research.summarize:
        tool: idea_update
        required_params: [idea_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      research.to_idea:
        tool: idea_create
        required_params: [title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      openclaw.research:    { tool: fetch, required_params: [query] }
      openclaw.compare:     { tool: fetch, required_params: [queries] }

  # ─── Rowboat (Knowledge Graph) ──────────────────────────────────────
  rowboat:
    agent: rowboat-chat
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [rowboat.]
    enabled: true
    description: "Knowledge graph queries, email drafts, decks."
    mcp_servers: [vibemind-db, fetch, spaces-rowboat]
    mcp_tools: { spaces-rowboat: [rowboat_status] }
    default_context: [current_space, recent_intents]
    events:
      rowboat.search:       { tool: search_knowledge,       required_params: [query] }
      rowboat.query:        { tool: query_knowledge,        required_params: [query] }
      rowboat.email_draft:  { tool: draft_email,            required_params: [recipient, topic] }
      rowboat.meeting_brief: { tool: generate_meeting_brief, required_params: [topic] }
      rowboat.deck:         { tool: generate_deck,          required_params: [topic] }
      rowboat.status:
        tool: rowboat_status
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-rowboat }
      rowboat.docker.start: { tool: shell_exec, required_params: [] }
      rowboat.docker.stop:  { tool: shell_exec, required_params: [] }

  # ─── Minibook (collaboration) ───────────────────────────────────────
  minibook:
    agent: brain-knowledge
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [minibook.]
    enabled: true
    description: "Minibook collaboration hub."
    mcp_servers: [vibemind-db, fetch, spaces-minibook]
    mcp_tools: { spaces-minibook: [minibook_status] }
    default_context: [current_space, session_id]
    events:
      minibook.discuss:       { tool: fetch, required_params: [topic] }
      minibook.collaborate:   { tool: fetch, required_params: [topic] }
      minibook.status:
        tool: minibook_status
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-minibook }
      minibook.list_projects: { tool: fetch, required_params: [] }

  # ─── Schedule (APScheduler tasks) ───────────────────────────────────
  schedule:
    agent: brain-scheduler
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [schedule.]
    keywords: ["termin|erinnerung|wecker|timer|schedule|reminder"]
    enabled: true
    description: "Scheduled tasks and reminders."
    mcp_servers: [vibemind-db, scheduled-tasks]
    default_context: [current_space, now]
    events:
      schedule.create:  { tool: schedule_create,        required_params: [title, action_text, trigger_config] }
      schedule.list:    { tool: schedule_list,          required_params: [] }
      schedule.cancel:  { tool: schedule_cancel,        required_params: [task_id] }
      schedule.modify:  { tool: schedule_modify,        required_params: [task_id] }
      schedule.status:  { tool: schedule_status,        required_params: [] }
      schedule.snooze:  { tool: schedule_snooze,        required_params: [task_id] }
      openclaw.cron:    { tool: schedule_openclaw_cron, required_params: [cron_expr, prompt] }

  # ─── n8n (workflow automation) ──────────────────────────────────────
  n8n:
    agent: brain-n8n
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [n8n.]
    keywords: ["workflow|automatisierung|n8n|automation"]
    enabled: true
    description: "n8n workflow CRUD + execution."
    mcp_servers: [vibemind-db, n8n]
    default_context: [current_space]
    events:
      n8n.generate:    { tool: n8n_generate_workflow, required_params: [description] }
      n8n.list:        { tool: n8n_list_workflows,    required_params: [] }
      n8n.status:      { tool: n8n_health_check,      required_params: [] }
      n8n.activate:    { tool: n8n_update_partial_workflow, required_params: [name] }
      n8n.deactivate:  { tool: n8n_update_partial_workflow, required_params: [name] }
      n8n.delete:      { tool: n8n_delete_workflow,   required_params: [name] }
      n8n.execute:     { tool: n8n_test_workflow,     required_params: [name] }
      n8n.describe:    { tool: n8n_get_workflow,      required_params: [name] }

  # ─── AgentFarm (multi-agent teams) ──────────────────────────────────
  agentfarm:
    # 2026-08-18 (user decision, docs/operations/2026-08-18-p1-agentfarm-
    # captain-cook-befund.md): Captain Cook IS the agentfarm — the space is
    # redefined by its real runtime. The old AutoGen team events described an
    # implementation that never had a persistent runtime (source tree removed
    # in ec98a0c); they described nothing that exists. This is a documented
    # redefinition, not a silent relabel.
    # Rule: delegated work goes through the Captain (audited, ledger);
    # direct Codex sessions are the user's manual channel. No third path.
    agent: null                    # tool-only: no chat agent; `vibemind`
                                   # (openrouter) becomes obsolete, not replaced
    generate_agent: false         # Captain Cook is the runtime; no OpenFang agent.toml
    aliases: [autogen, captain_cook]
    prefixes: [agentfarm., captain.]
    keywords: ["agent.?farm|captain|delivery|orchestrat"]
    enabled: true
    description: "Auditable agent-work orchestration: plan, gate, route, ledger (Captain Cook)."
    mcp_servers: [captain-cook]
    runtime:
      status: active
      source_path: spaces/captain_cook
      transport: mcp               # via OpenFang /mcp -> scripts/mcp_servers/captain_cook_mcp.py
      token_env: CAPTAIN_RUNTIME_TOKEN   # own key on purpose, never inherited
    default_context: [current_space]
    # Coarse events outside, fine refs inside: the Brain never invents
    # batch/subtask/workspace refs — deliver returns them, status passes
    # them through.
    events:
      agentfarm.deliver: { tool: captain_deliver,      required_params: [project_id, prompt_ref] }
      agentfarm.status:  { tool: captain_codex_status, required_params: [project_id, batch_id, subtask_id, workspace_ref] }

  # ─── Learning (courses, adaptive practice, canvas) ─────────────────
  learning:
    agent: brain-learning
    aliases: [learn, course, quiz]
    prefixes: [learning.]
    enabled: true
    description: "Source-grounded course authoring and adaptive local learning."
    mcp_servers: [spaces-learning]
    mcp_tools:
      spaces-learning:
        - learning_status
        - learning_course_list
        - learning_course_create
        - learning_course_open
        - learning_material_import
        - learning_course_generate
        - learning_generation_status
        - learning_course_review
        - learning_course_publish
        - learning_chapter_open
        - learning_session_start
        - learning_task_next
        - learning_task_answer
        - learning_hint_request
        - learning_tutor_ask
        - learning_progress_show
        - learning_canvas_open
        - learning_canvas_save
        - learning_canvas_hint
        - learning_canvas_submit
        - learning_canvas_review
    system_prompt_hint: "Use only Learning MCP tools. Treat application readback as success evidence and fail closed when a dependency, approval, revision, or readback is missing."
    default_context: [current_space, course_id, session_id]
    events:
      learning.status:
        tool: learning_status
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.course.list:
        tool: learning_course_list
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.course.create:
        tool: learning_course_create
        required_params: [title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.course.open:
        tool: learning_course_open
        required_params: [course_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.material.import:
        tool: learning_material_import
        required_params: [course_id, artifact_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.course.generate:
        tool: learning_course_generate
        required_params: [course_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }
      learning.generation.status:
        tool: learning_generation_status
        required_params: [job_id]
        required_provenance: [approval_ref, cost_ref]
