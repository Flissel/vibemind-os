# VibeMind Space→Agent→Tools Registry
# Single source of truth for: event_type → space → agent → mcp_scope → tool_hint
#
# Used by:
#   - voice/python/swarm/routing/space_agent_registry.py (Python loader)
#   - scripts/sync_openfang_agents.py (generates openfang/agents/brain-*/agent.toml)
#
# Schema: version 1

version: 1

defaults:
  fallback_agent: brain-fallback
  default_context_fields: [current_space, session_id, conversation_turns]
  openfang_url: http://localhost:4200
  voice_timeout_s: 1.5

spaces:

  # ─── Bubbles (canvas CRUD) ─────────────────────────────────────────
  bubbles:
    agent: brain-bubbles
    # Legacy input spelling only. Persisted/routed identity stays "bubbles".
    aliases: [shuttles]
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [bubble.]
    enabled: true
    description: "Bubble CRUD + navigation on the VibeMind canvas."
    mcp_servers: [vibemind-db, vibemind, spaces-ideas]
    # M5 2026-08-07: ohne mcp_tools bekommt der Agent KEINE MCP-Tools —
    # der Generator leitet die tools-Liste nur hieraus ab, nicht aus
    # mcp_servers (fail-closed by design, sync_openfang_agents.py:86;
    # im Daemon-Log belegt: tool_names waren nur memory_store/-recall).
    # Bewusst minimal: genau die drei Operationen, die bubble_promote
    # braucht (Idee lesen, Projekt anlegen, Idee als promoted markieren).
    mcp_tools:
      spaces-ideas: [bubble_create, bubble_rate, bubble_promote, bubble_delete]
      vibemind-db: [db_ideas_get, db_ideas_update, db_projects_create]
    system_prompt_hint: "You manage bubbles (idea clusters) on the VibeMind canvas. Use the preferred_tool hint in the intent envelope; only call other tools if the hint fails."
    default_context: [current_space, current_bubble, idea_count]
    events:
      bubble.list:              { tool: vibemind_bubbles,       required_params: [] }
      bubble.create:
        tool: bubble_create
        required_params: [title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      bubble.enter:             { tool: vibemind_bubble_enter,  required_params: [bubble_name] }
      bubble.exit:              { tool: vibemind_bubble_exit,   required_params: [] }
      bubble.back:              { tool: vibemind_bubble_exit,   required_params: [] }
      # "Lösche diese Bubble" (24.11.2026): nur die offene Bubble, nur nach Rückfrage mit der Zahl der
      # Karten und "Ja, löschen" (Schlüssel, brain/the_brain/core/loesch_bestaetigung.py). Die Karten
      # gehen mit (mit_karten, höchstens 200), ihre Verbindungen auch; "Zurück" stellt alles wieder her.
      bubble.delete:
        tool: bubble_delete
        required_params: [id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      bubble.delete_all_except: { tool: db_ideas_delete,        required_params: [keep_name] }
      bubble.update:            { tool: vibemind_bubble_update, required_params: [bubble_id] }
      bubble.find:              { tool: vibemind_bubbles,       required_params: [query] }
      bubble.stats:             { tool: vibemind_bubbles,       required_params: [] }
      bubble.score:             { tool: vibemind_bubbles,       required_params: [bubble_id] }
      bubble.evaluate:          { tool: vibemind_bubble_update, required_params: [bubble_id] }
      # Fest, ohne Modell: nur ganze Bubbles werden befoerdert (Felix 23.11.2026).
      bubble.promote:
        tool: bubble_promote
        required_params: [bubble_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      # Fest, ohne Modell: Zahl 0 bis 100 an der Bubble.
      bubble.rate:
        tool: bubble_rate
        required_params: [id, score]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      bubble.current:           { tool: vibemind_bubbles,       required_params: [] }

  # ─── Ideas (notes inside bubbles) ───────────────────────────────────
  ideas:
    agent: brain-ideas
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [idea.]
    enabled: true
    description: "Idea notes inside bubbles — create, update, link, format."
    mcp_servers: [vibemind-db, spaces-ideas]
    # 23.11.2026: feste Werkzeuge des Ideen-Space (spaces/ideas/mcp_server.py), alle ohne Modell und ueber
    # aenderung_id ruecknehmbar. Befoerdert werden nur ganze Bubbles; die Begruendung einer Bewertung geht
    # ueber bewertung_begruenden an die Bubble (Felix 23.11.).
    mcp_tools:
      spaces-ideas:
        - idea_connect
        - aenderung_zurueck
        - idea_create
        - idea_update
        - idea_delete
        - idea_list
        - idea_format
        - idea_arrange
        - idea_auto_link
        - idea_rate
        - bewertung_begruenden
        - bewertung_entfernen
        - idea_document
        - bubble_wurzel
        - idea_group
    default_context: [current_space, current_bubble, idea_titles]
    events:
      # Feste Aufrufe (ohne Modell) ueber den Ideen-Server, nur mit Kennungen;
      # Vertrag und Nachpruefung: brain/the_brain/core/ideen_fest_contract.py.
      idea.list:
        tool: idea_list
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.create:
        tool: idea_create
        required_params: [bubble_id, title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.update:
        tool: idea_update
        required_params: [id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.format:
        tool: idea_format
        required_params: [id, format]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.arrange:
        tool: idea_arrange
        required_params: [bubble_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.rate:
        tool: idea_rate
        required_params: [id, score]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.rate_reason:
        tool: bewertung_begruenden
        required_params: [bubble_id, text]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      # "Lösche die Begründung 2 [von X]" (24.11.2026): eine Begründung aus metadata.bewertungen,
      # gezählt wie angezeigt (neueste zuerst); "Zurück" holt sie wieder.
      idea.rate_reason_delete:
        tool: bewertung_entfernen
        required_params: [bubble_id, nummer]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      # "Lösche die Karte X" (24.11.2026): nur nach Rückfrage und "Ja, löschen", fester Aufruf mit
      # Schlüssel (brain/the_brain/core/loesch_bestaetigung.py); die Verbindungen gehen mit, "Zurück"
      # holt Karte und Verbindungen wieder. Vorher zeigte das Ereignis auf db_ideas_delete, das
      # brain-ideas nicht hat: der Planer scheiterte (cap unbekannt).
      idea.delete:
        tool: idea_delete
        required_params: [id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.find:                { tool: db_ideas_list,   required_params: [query] }
      idea.connect:
        tool: idea_connect
        required_params: [from_id, to_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      # "Zurueck": nimmt die juengste Aenderung eines Agenten an Ideen und Bubbles
      # zurueck (oder die genannte Gruppe). Nur ueber den Ideen-Server, weil nur der
      # Dienstschluessel ideen_zurueck aufrufen darf.
      idea.aenderung_zurueck:
        tool: aenderung_zurueck
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.auto_link:
        tool: idea_auto_link
        required_params: [bubble_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.current_space:       { tool: db_ideas_list,   required_params: [] }
      # Entfernt (zeigten auf db_ideas_update; das hat brain-ideas nicht, mcp_tools oben nennt
      # nur spaces-ideas):
      # - idea.format_* und idea.convert_format: Darstellung wechseln geht ueber den festen
      #   Aufruf idea.format (oben); die Faehigkeiten idea_format_* zielen auf supabase:idea.format.
      # - idea.add_image: im Ideen-Space gibt es keinen Bildweg; der Satz sagt "kann ich noch nicht"
      #   (brain/the_brain/core/ideen_abkuerzung.py, BILD_NOCH_NICHT).
      # - idea.explore.start / idea.explore.stop: kein Code dahinter. Einzelne Ereignisse kennen
      #   kein enabled: false (nur ganze Spaces), darum ausgetragen statt abgeschaltet.
      # Modellauftraege mit Rueckweg (brain/the_brain/core/ideen_rueckweg.py): der Agent hat dafuer
      # kein Werkzeug, er antwortet mit einem JSON-Objekt; das Gehirn schreibt ueber idea_update
      # bzw. bewertung_begruenden mit Vertrag und Nachpruefung.
      idea.expand:              { rueckweg: ausformulieren, required_params: [id] }
      idea.explain:             { rueckweg: einschaetzen,   required_params: [id] }
      # Zusammenfassung (ein Lauf) und White Paper (ein Lauf je Abschnitt, Zusammenbau ohne Modell),
      # brain/the_brain/core/ideen_dokument.py; geschrieben wird ueber idea.document.
      idea.summarize:           { rueckweg: zusammenfassen, required_params: [bubble_id] }
      idea.whitepaper:          { rueckweg: abschnitt,      required_params: [bubble_id] }
      # Nach Thema gruppieren (ein Lauf, Rueckweg "gruppieren"): der Agent nennt Gruppen mit Kuerzeln,
      # das Gehirn setzt Lage, Ueberschrift-Karten und auf Wunsch Verbindungen ueber idea.group_layout.
      idea.group:               { rueckweg: gruppieren,     required_params: [bubble_id] }
      idea.group_layout:
        tool: idea_group
        required_params: [bubble_id, gruppen]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.document:
        tool: idea_document
        required_params: [id, bubble_id, title, art, content]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      # "Mach X zur Wurzel": festgelegte Wurzel der Bubble fuer das White Paper (metadata.wurzel).
      idea.root:
        tool: bubble_wurzel
        required_params: [bubble_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      idea.analyze_links:       { tool: db_canvas_nodes, required_params: [] }
      # idea.to_project (db_projects_create) ist weg (24.11.2026): ein Projekt entsteht nur ueber
      # bubble.promote mit Pruefung, Rueckfrage und Aenderungs-Kennung.

  # ─── Coding (code gen + edits) ──────────────────────────────────────
  coding:
    agent: brain-coder
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [code.]
    enabled: true
    description: "Code generation, editing, testing, review."
    mcp_servers: [vibemind-db, filesystem, git, github, context7, qdrant, fetch, brain, issue-detector]
    default_context: [current_space, recent_intents]
    events:
      code.generate:      { tool: "coding-engine:POST:/api/v1/jobs", required_params: [description] }
      code.modify:        { tool: "coding-engine:POST:/api/v1/jobs", required_params: [description, file_path] }
      code.status:        { tool: "coding-engine:GET:/api/v1/jobs/{job_id}/status", required_params: [] }
      code.show:          { tool: "coding-engine:GET:/api/v1/jobs/{job_id}/results", required_params: [] }
      # 2026-09-08: the engine (src/api/main.py) serves no /api/preview route.
      # Both preview capabilities are enabled: false in capabilities.yaml, so
      # these two events fail closed rather than call a dead contract.
      code.preview.start: { tool: "coding-engine:POST:/api/preview/create", required_params: [project_id, project_path] }
      code.preview.stop:  { tool: "coding-engine:POST:/api/preview/{project_id}/stop", required_params: [project_id] }
      code.list:          { tool: "coding-engine:GET:/api/v1/jobs", required_params: [] }
      code.cancel:        { tool: "coding-engine:POST:/api/v1/jobs/{job_id}/cancel", required_params: [] }

  # ─── Desktop automation ─────────────────────────────────────────────
  desktop:
    agent: brain-desktop
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [desktop., web., messaging., openclaw.]
    keywords: ["screenshot|bildschirm|klick|browser|click"]
    enabled: true
    description: "Desktop/window automation via pyautogui/moire."
    mcp_servers: [vibemind-db, desktop-automation, spaces-desktop]
    # 23.11.2026: feste Werkzeuge des Desktop-Space (spaces/desktop/mcp_server.py). Ohne den Schalter
    # VIBEMIND_DESKTOP_AUSFUEHREN ist jede Aufgabe ein Trockenlauf. Die Schritte einer Aufgabe fuehrt das
    # Gehirn selbst aus (Felix 23.11.: "Weg 2, Gehirn fuehrt"); der Agent bekommt keine eigenen Haende.
    # desktop_elements und desktop_task_step (der eigentliche Klick) ruft nur die Schleife des Gehirns
    # auf (core/desktop_schleife.py). Jeder Aufruf geht vorher durch den Vertrag
    # (core/desktop_schleife_contract.py: pruefe_aktion, pruefe_aufruf), und die Schleife laeuft nur bei
    # getippter Eingabe. desktop_find bleibt gesperrt.
    mcp_tools:
      spaces-desktop:
        - desktop_status
        - desktop_screen_read
        - desktop_screenshot
        - desktop_task_start
        - desktop_task_finish
        - desktop_task_status
        - desktop_elements
        - desktop_task_step
        - desktop_blick
        - desktop_fenster
        - desktop_app
        - desktop_hand_klick
    default_context: [current_space, active_window]
    events:
      # Feste Aufrufe (ohne Modell) ueber den Desktop-Server.
      desktop.status:
        tool: desktop_status
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      # Augen fuer andere Spaces (Felix 23.11.): Programm, Fenstertitel, Bedienelemente, ohne OCR.
      # Nur fuer die Nachpruefung truth:desktop_sicht (core/desktop_sicht.py); kein Satz fuehrt hierher.
      desktop.blick:
        tool: desktop_blick
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      # Fester Lesesatz "Welche Fenster sind offen?" (core/desktop_fenster.py): Programm und Titel der
      # sichtbaren Fenster, gesperrte nur als "ein gesperrtes Fenster". Titel nur in der Antwort an die App.
      desktop.fenster:
        tool: desktop_fenster
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      # Fester Satz mit Handlung "Öffne den Editor" / "Hol Chrome nach vorn" (core/desktop_app.py):
      # nur editor, chrome, explorer, ohne Argumente; jede Ausfuehrung als Aufgabe im Aufgabenbuch.
      desktop.app:
        tool: desktop_app
        required_params: [programm, modus]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      # Klick aus der Desktop-Ansicht durchreichen (core/desktop_hand.py, POST /api/desktop/hand-klick):
      # STOP, laufende Aufgabe und Sperrliste fuer das Fenster unter dem Punkt prueft das Werkzeug;
      # jeder Klick als kurze Aufgabe "Hand: Klick" im Aufgabenbuch (Marken: GET /api/desktop/klicks).
      desktop.hand:
        tool: desktop_hand_klick
        required_params: [x, y]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      desktop.read:
        tool: desktop_screen_read
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      desktop.task.status:
        tool: desktop_task_status
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      # Nur fuer die Schleife des Gehirns; kein Satz fuehrt direkt hierher.
      desktop.elements:
        tool: desktop_elements
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      desktop.task.step:
        tool: desktop_task_step
        required_params: [task_id, action]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
        requires_confirmation: true
        result_validation: external_receipt
      desktop.task.stop:
        tool: desktop_task_finish
        required_params: [task_id, state]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      desktop.open_app:       { tool: desktop_open_app,    required_params: [app_name], requires_confirmation: true, result_validation: external_receipt }
      desktop.click:          { tool: desktop_click,       required_params: [element], requires_confirmation: true, result_validation: external_receipt }
      desktop.type:           { tool: desktop_type,        required_params: [text], requires_confirmation: true, result_validation: external_receipt }
      desktop.press_key:      { tool: desktop_press_key,   required_params: [key], requires_confirmation: true, result_validation: external_receipt }
      desktop.screenshot:
        tool: desktop_screenshot
        required_params: []
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
      desktop.scroll:         { tool: desktop_scroll,      required_params: [direction], requires_confirmation: true, result_validation: external_receipt }
      # Legt nur die Aufgabe im Aufgabenbuch an (Trockenlauf ohne Schalter); Schritte folgen ueber das Gehirn.
      desktop.task:
        tool: desktop_task_start
        required_params: [task]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-desktop }
        requires_confirmation: true
        result_validation: external_receipt
      desktop.task.create:    { tool: desktop_task,        required_params: [task], requires_confirmation: true, result_validation: external_receipt }
      desktop.task.update:    { tool: desktop_task,        required_params: [task_id], requires_confirmation: true, result_validation: external_receipt }
      desktop.task.list:      { tool: desktop_task,        required_params: [] }
      desktop.moire.scan:     { tool: desktop_screenshot,  required_params: [] }
      desktop.moire.find:     { tool: desktop_screenshot,  required_params: [query] }
      messaging.whatsapp:     { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      messaging.telegram:     { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      messaging.send:         { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      web.search:             { tool: fetch,               required_params: [query] }
      web.fetch:              { tool: fetch,               required_params: [url] }
      openclaw.status:        { tool: desktop_task,        required_params: [] }
      openclaw.notifications: { tool: desktop_task,        required_params: [] }
      openclaw.prompt:        { tool: desktop_task,        required_params: [prompt], requires_confirmation: true, result_validation: external_receipt }
      openclaw.browse:        { tool: fetch,               required_params: [url] }
      openclaw.scrape:        { tool: fetch,               required_params: [url] }
      openclaw.screenshot.web: { tool: desktop_screenshot, required_params: [url] }
      openclaw.fill_form:     { tool: desktop_type,        required_params: [form_data], requires_confirmation: true, result_validation: external_receipt }
      openclaw.message.send:  { tool: desktop_task,        required_params: [message], requires_confirmation: true, result_validation: external_receipt }
      openclaw.message.read:  { tool: desktop_task,        required_params: [] }
      openclaw.linkedin.search: { tool: fetch, required_params: [query] }
      openclaw.monitor:       { tool: desktop_task,        required_params: [] }

  # ─── Research (web + ideas) ─────────────────────────────────────────
  research:
    agent: brain-researcher
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [research.]
    enabled: true
    description: "Web research + summarization into ideas."
    # E9: Die Schreib-Events laufen über spaces-ideas statt über den breiten
    # vibemind-db-Server. Nach dem Umbinden bindet kein Event mehr ein
    # vibemind-db-Tool, darum entfällt der Server hier ganz.
    # qdrant bleibt ohne mcp_tools-Eintrag — Server-Scope ohne abgeleitete
    # Capability, wie im Bubbles-Block bei `vibemind`.
    # 24.11.2026: spaces-research gehoert NICHT hierher. brain-researcher ist ein Agent mit
    # Modell-Schleife; mit research_start in seinen Werkzeugen koennte das Modell selbst
    # confirm=true schicken und die Rueckfrage umgehen. Die festen Aufrufe des Gehirns laufen
    # ueber den Rechtetraeger brain-recherche (Block "recherche" unten).
    mcp_servers: [fetch, spaces-ideas, qdrant]
    # M5 2026-08-07 / E10: ohne mcp_tools bekommt der Agent KEINE MCP-Tools —
    # der Generator leitet die tools-Liste nur hieraus ab, nicht aus
    # mcp_servers (fail-closed by design, sync_openfang_agents.py:86).
    # Genau daran war dieser Space bisher nicht ausführbar: alle sechs Events
    # banden auf Werkzeuge, die das Manifest nie führte.
    # Bewusst minimal: genau die Werkzeuge, die die Events oben binden.
    mcp_tools:
      fetch: [fetch]
      spaces-ideas: [idea_create, idea_update]
    # 24.11.2026 (Vorgabe des Betreibers: nur das Claude-Abo, kein bezahltes API-Modell): Claude Code
    # statt gpt-4o, wie im Betrieb: haiku ueber den eigenen Wrapper scripts/agents/<agent>.cmd
    # (base_url setzt der Abgleich, nicht diese Datei). Ein Wechsel auf sonnet ist eine
    # Budget-Entscheidung des Betreibers: modell und wrapper in agent_budget.yaml, Wrapper neu
    # erzeugen, dann hier nachziehen. Der claude-code-Treiber reicht keine MCP-Werkzeuge an
    # das Modell (tool_calls immer leer): research.web/scrape ueber fetch laufen damit nicht.
    # Die Recherche zu einer Bubble holt die Seiten darum selbst (spaces/research, Rueckweg).
    model:
      provider: claude-code
      model: claude-code/haiku
      max_tokens: 16384
    default_context: [current_space, current_bubble]
    events:
      research.web:         { tool: fetch, required_params: [query] }
      research.scrape:      { tool: fetch, required_params: [url] }
      research.summarize:
        tool: idea_update
        required_params: [idea_id]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      research.to_idea:
        tool: idea_create
        required_params: [title]
        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-ideas }
      openclaw.research:    { tool: fetch, required_params: [query] }
      openclaw.compare:     { tool: fetch, required_params: [queries] }

