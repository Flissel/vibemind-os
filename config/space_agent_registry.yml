        required_provenance: [approval_ref, cost_ref]
        execution: { kind: mcp, server: spaces-learning }

  # ─── Video (generation + vision) ────────────────────────────────────
  video:
    agent: brain-video
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [video.]
    enabled: true
    description: "Video generation, vision, lipsync."
    mcp_servers: [laura, vibemind-db]
    default_context: [current_space]
    events:
      video.status:       { tool: video_status,             required_params: [] }
      video.team_status:  { tool: db_query,                 required_params: [] }
      video.team_run:     { tool: db_update,                required_params: [task] }
      video.vision:       { tool: db_query,                 required_params: [url] }
      video.demo_analyze: { tool: db_query,                 required_params: [url] }
      video.demo_build:   { tool: db_video_project_create,  required_params: [description] }
      video.lipsync:      { tool: db_video_project_create,  required_params: [video, audio] }
      video.voice_clone:  { tool: db_video_project_create,  required_params: [audio] }
      video.voice_tts:    { tool: db_video_project_create,  required_params: [text] }

  # ─── Flowzen (wellness, check-ins) ──────────────────────────────────
  flowzen:
    agent: brain-wellness
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [rose.]
    enabled: true
    description: "Wellness check-ins, diary, daily flow."
    mcp_servers: [vibemind-db]
    default_context: [current_space, today_mood]
    events:
      rose.recommend: { tool: db_flowzen_checkin,      required_params: [] }
      rose.accept:    { tool: db_flowzen_checkin,      required_params: [] }
      rose.status:    { tool: db_flowzen_activity,     required_params: [] }

  # ─── MiroFish (prediction + graphs) ─────────────────────────────────
  mirofish:
    agent: brain-forecaster
    # ABSORB-5/6 (Phase 0): routing bindings derive from HERE (registry = SoT)
    prefixes: [mirofish.]
    enabled: true
    description: "Forecasting, graph queries, predictions."
    mcp_servers: [vibemind-db]
    default_context: [current_space]
    events:
      mirofish.simulate:     { tool: 'mirofish:simulate',     required_params: [simulation_id] }
      mirofish.predict:      { tool: 'mirofish:predict',      required_params: [simulation_id] }
      mirofish.graph.build:  { tool: 'mirofish:graph.build',  required_params: [project_id] }
      mirofish.graph.search: { tool: 'mirofish:graph.search', required_params: [graph_id, query] }
      mirofish.status:       { tool: 'mirofish:status',       required_params: [job_id] }
      mirofish.evaluate:     { tool: 'mirofish:evaluate',     required_params: [simulation_id] }
      mirofish.interview:    { tool: 'mirofish:interview',    required_params: [simulation_id, agent_id, prompt] }
