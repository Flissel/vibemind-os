    description: "Das Gehirn selbst: Hintergrund-Gedanken ueber die eigene Schnittstelle lesen."
    default_context: [current_space]
    events:
      thebrain.gedanken: { tool: "brain:GET:/api/cortex/thoughts", required_params: [] }

  # ─── AgentFarm (multi-agent teams) ──────────────────────────────────
  agentfarm:
    # 2026-08-18 (user decision, docs/operations/2026-08-18-p1-agentfarm-
    # captain-cook-befund.md): Captain Cook IS the agentfarm — the space is
    # redefined by its real runtime. The old AutoGen team events described an
    # implementation that never had a persistent runtime (source tree removed
    # in ec98a0c); they described nothing that exists. This is a documented
    # redefinition, not a silent relabel.
    # Rule: delegated work goes through the Captain (audited, ledger);
    # direct Codex sessions are the user's manual channel. No third path.
    agent: null                    # tool-only: no chat agent; `vibemind`
                                   # (openrouter) becomes obsolete, not replaced
    generate_agent: false         # Captain Cook is the runtime; no OpenFang agent.toml
    aliases: [autogen, captain_cook]
    prefixes: [agentfarm., captain.]
    keywords: ["agent.?farm|captain|delivery|orchestrat"]
    enabled: true
    description: "Auditable agent-work orchestration: plan, gate, route, ledger (Captain Cook)."
    mcp_servers: [captain-cook]
    runtime:
      status: active
      source_path: spaces/captain_cook
      transport: mcp               # via OpenFang /mcp -> scripts/mcp_servers/captain_cook_mcp.py
      token_env: CAPTAIN_RUNTIME_TOKEN   # own key on purpose, never inherited
    default_context: [current_space]
    # Coarse events outside, fine refs inside: the Brain never invents
    # batch/subtask/workspace refs — deliver returns them, status passes
    # them through.
    events:
      agentfarm.deliver: { tool: captain_deliver,      required_params: [project_id, prompt_ref] }
      agentfarm.status:  { tool: captain_codex_status, required_params: [project_id, batch_id, subtask_id, workspace_ref] }

  # ─── Event-Orga (Festival-/Event-Bot, Teil 2) ───────────────────────
  event-management:
    # Weg B (Entscheidung 2026-11-12): der Event-Bot (OpenClaw-Gateway) IST der
    # Agent. Es gibt keinen OpenFang-Agenten und keinen agent.toml.
    agent: null
    generate_agent: false
    aliases: [festival, orga, veranstaltung]
    prefixes: [event.]
    keywords: ['festival|veranstaltung|orga.?gruppe|event.?orga|webinar|hackathon|\b(?:die|der|zur|auf\s+der|einer?)\s+messe\b|\b\w+messe\b|weihnachtsfeier|team.?meeting|\b(?:das|dem|vom|beim|zum|aufs?|unser\w*|ein\w*)\s+fest\b|\b(?!manifest)\w{3,}fest\b']
    enabled: true
    description: "Event organisation assistant: tasks, teams, budget and guest counts of an event via the Event-Bot."
    mcp_servers: []
    runtime:
      status: active
      source_path: spaces/event_management
      transport: openclaw-http     # direct:spaces.event_management.uebergabe -> Gateway /v1/chat/completions
      token_env: EVENT_GATEWAY_TOKEN
    default_context: [current_space]
    # Coarse events outside, fine tools inside: the Bot owns the 20 app tools
    # (SOUL.md / tools.allow), the Brain only asks (ask) or orders (do).
    events:
      event.ask: { tool: event_ask, required_params: [text] }
      event.do:  { tool: event_do,  required_params: [text] }

  # ─── Sales (sales-claw): Auftragsbuch, Stufe 1 ──────────────────────
  # Bewusst ohne aliases und keywords: Kein Satz des Betreibers wird in Stufe 1
  # nach `sales` geroutet. Der Eintrag macht nur die zwei Werkzeuge des
