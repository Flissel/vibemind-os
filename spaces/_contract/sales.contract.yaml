# Schlanker Vertrag für den Space `sales` (Auftragsarten, ADR-0005).
#
# Die Capabilities dieses Space kommen erst mit Stufe 4 des Auftragsvertrags
# dazu; bis dahin trägt der Vertrag nur seine Auftragsarten.
#
# Verbotene Wege für Ausführer dieser Arten (termine_heute, freigaben_zaehlen, post_offen):
# Wer diese Arten ausführt, darf NIE einen der folgenden vier Wege nutzen. Sie geben Dinge
# frei oder bewegen Post, ohne dass der Betreiber es entscheidet:
#   1. antwort_entwerfen auf Stufe auto (Antworten gingen ohne Freigabe hinaus)
#   2. kontakt_autonomie_setzen (der Ausführer könnte sich selbst mehr Freiheit geben)
#   3. mail_einstufen (sofortiges Aussortieren als Spam; Post würde verschoben)
#   4. sales-auto (Entwürfe würden direkt freigegeben)
# Das Verzeichnis darf die ersten drei Werkzeuge keinem Space freischalten (Regel 6 in
# spaces/auftragsbuch/gleichstand.py).
# Jede Zahl der drei Zählarten entspricht dem, was der Ladenbesitzer auf der zugehörigen Seite sieht.
#
# Titel in `faellig` dürfen den Namen des Kontakts und den Betreff nennen.
# Mail-Text, Adressen und Nummern stehen nie in einem Feld.

id: sales
description: "Geschäftspost prüfen, fällige Punkte melden, Antwortentwürfe zur Freigabe anlegen"
prefixes: ["sales."]

capabilities: []

auftragsarten:
  - art: post_pruefen
    version: 2
    veraendert: true
    frist_min: 15
    nachpruefung: beleg
    beschreibung: >-
      Der Sales-Agent prüft die Geschäftspost von heute und meldet die Punkte,
      um die sich der Betreiber heute kümmern muss. Auf Wunsch legt er dazu
      Antwortentwürfe an; diese warten immer auf die Freigabe des Betreibers
      und werden nie von selbst gesendet. Gemeldet werden nur Kennungen,
      Titel, Fristen und Links, nie der Mail-Text.
    eingabe:
      type: object
      additionalProperties: false
      required: [zeitraum, entwuerfe_anlegen]
      properties:
        zeitraum:
          type: string
          enum: [heute]
        entwuerfe_anlegen:
          type: boolean
    ergebnis:
      type: object
      additionalProperties: false
      required: [faellig, anzahl_gelesen, kontakte_neu]
      properties:
        faellig:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [punkt_id, titel, frist, link, entwurf_id]
            properties:
              punkt_id:
                type: string
                pattern: "^[a-f0-9]{16}$"
              titel:
                type: string
                maxLength: 200
              frist:
                type: [string, "null"]
                pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
              link:
                type: string
                maxLength: 500
                pattern: '^/(?!/)[^\s]*$'
                not:
                  pattern: '\s'
              entwurf_id:
                type: [string, "null"]
                pattern: "^[A-Za-z0-9_-]{1,64}$"
        anzahl_gelesen:
          type: integer
          minimum: 0
        kontakte_neu:
          type: integer
          minimum: 0

  - art: kontakt_finden
    version: 1
    veraendert: false
    frist_min: 5
    nachpruefung: form
    beschreibung: >-
      Sales sucht Kontakte, deren Name den Suchtext enthält, und meldet
      höchstens zehn Treffer mit Kennung, Titel und Link in die
      Sales-Oberfläche. Es wird nichts verändert. Gemeldet werden nie
      Adressen oder Nummern.
    eingabe:
      type: object
      additionalProperties: false
      required: [suche]
      properties:
        suche:
          type: string
          minLength: 2
          maxLength: 100
    ergebnis:
      type: object
      additionalProperties: false
      required: [treffer, anzahl]
      properties:
        treffer:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [kontakt_id, titel, link]
            properties:
              kontakt_id:
                type: string
                pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
              titel:
                type: string
                maxLength: 200
              link:
                type: string
                pattern: "^/kontakte/[0-9a-f-]{36}$"
        anzahl:
          type: integer
          minimum: 0
          maximum: 10

  - art: termine_heute
    version: 1
    veraendert: false
    frist_min: 5
    nachpruefung: form
    beschreibung: >-
      Sales zählt die Termine von heute so, wie sie die Tagesansicht des
      Kalenders dem Ladenbesitzer zeigt, dazu die Kundentermine von heute wie
      auf der Startseite und die Kalender, die gerade nicht antworten. Es wird
      nichts verändert. Gemeldet werden nur Zahlen, nie Titel, Namen oder Orte.
    eingabe:
      type: object
      additionalProperties: false
      properties: {}
    ergebnis:
      type: object
      additionalProperties: false
      required: [anzahl, anzahl_kunden, quellen_stumm]
      properties:
        anzahl:
          type: integer
          minimum: 0
          maximum: 500
        anzahl_kunden:
          type: integer
          minimum: 0
          maximum: 500
        quellen_stumm:
          type: integer
          minimum: 0
          maximum: 50

  - art: freigaben_zaehlen
    version: 1
    veraendert: false
    frist_min: 5
    nachpruefung: form
    beschreibung: >-
      Sales zählt die Entwürfe, die auf die Freigabe des Betreibers warten, und
      die fehlgeschlagenen. Es wird nichts verändert und nichts freigegeben.
      Gemeldet werden nur Zahlen, nie Empfänger oder Texte.
    eingabe:
      type: object
      additionalProperties: false
      properties: {}
    ergebnis:
      type: object
      additionalProperties: false
      required: [wartend, fehlgeschlagen]
      properties:
        wartend:
          type: integer
          minimum: 0
          maximum: 10000
        fehlgeschlagen:
          type: integer
          minimum: 0
          maximum: 10000

  - art: post_offen
    version: 1
    veraendert: false
    frist_min: 5
    nachpruefung: form
    beschreibung: >-
      Sales zählt unbeantwortete Kundennachrichten in den Chat-Kanälen und
      Mails, die noch nicht erledigt sind, so wie sie der Ladenbesitzer in der
      Oberfläche sieht. Es wird nichts verändert und nichts abgeholt. Gemeldet
      werden nur Zahlen, nie Absender, Betreffs oder Texte.
    eingabe:
      type: object
      additionalProperties: false
      properties: {}
    ergebnis:
      type: object
      additionalProperties: false
      required: [chats_unbeantwortet, mails_offen]
      properties:
        chats_unbeantwortet:
          type: integer
          minimum: 0
          maximum: 10000
        mails_offen:
          type: integer
          minimum: 0
          maximum: 10000
