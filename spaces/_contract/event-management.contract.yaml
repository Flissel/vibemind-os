# Schlanker Vertrag fuer den Space `event-management` (Orga-Assistent eines
# Events, uebernommen vom Festival-Bot, 12.11.2026).
#
# Grobe Events aussen, feine Werkzeuge innen (Muster agentfarm): der Brain sieht
# nur zwei Capabilities -- `event_ask` (lesende Frage) und `event_do`
# (schreibender Auftrag). Eine Capability ist die Sicht des Brain, nicht die
# Werkzeugliste des Bots. Die 20 App-Werkzeuge stehen in
# spaces/event_management/config/workspace/SOUL.md (Werkzeugtabelle) und in den
# `tools.allow` der Agenten in config/openclaw.json (brain-lesen: nur lesende,
# brain-auftrag: alle). Sie gehoeren dem MCP-Server der Event-App, nicht diesem
# Repo; der Foto-Upload laeuft per Skill (event-task-image-uploads).
#
# Verdrahtet in: config/space_agent_registry.yml, spaces/_navigator/registry.py,
# brain/the_brain/data/capabilities.yaml (direct:-Ziele in uebergabe.py).

id: event-management
description: "Event-Orga: Aufgaben, Teams, Budget und Gaestezahlen eines Events ueber den Orga-Chat pflegen."
prefixes: ["event."]

capabilities:
  - {name: event_ask, writes: false}   # Frage -> Agent brain-lesen
  - {name: event_do,  writes: true}    # Auftrag -> Agent brain-auftrag
