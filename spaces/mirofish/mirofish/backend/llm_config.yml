# =============================================================================
# Mirofish runtime LLM configuration
# =============================================================================
# Docker copies backend/ into the image, so this file lands at
# /app/backend/llm_config.yml -- the second path vibemind_shared's loader
# searches (see backend/app/utils/llm_client.py, the fixed OpenFang gateway).
# The central llm_config.yml.example is the source of truth and
# scripts/check_openfang_llm_config.py rejects drift for roles.space_mirofish.
# =============================================================================

keys:
  openfang: ${OPENFANG_API_KEY}
  mirofish_shim: ${LLM_API_KEY}

providers:
  openfang:
    type: openai
    base_url: ${OPENFANG_URL}/v1
    key_ref: openfang
    fail_closed: true
    # Ein Abo-Aufruf ueber OpenFang dauert 10 bis ueber 100 s; OpenFang arbeitet Anfragen an denselben
    # Agenten nacheinander ab. 30 s mit 3 Wiederholungen brach jeden laengeren Aufruf ab ("OpenFang unreachable")
    # und stellte Wiederholungen hinter den noch laufenden Aufruf. Das Tor am PC wartet 300 s.
    max_retries: 1
    timeout_seconds: 280
  # 26.11.2026, Entscheidung des Betreibers ("Ja, alles ueber den Shim"): MiroFish holt sein Modell ueber den
  # eigenen Abo-Shim am PC (scripts/mirofish_shim.py im aeusseren Repo: Schluessel, hoechstens 2 gleichzeitig,
  # Budget mirofish-simulation). Grund: Der Agentenweg ueber OpenFang reicht nur die letzte Nutzernachricht durch,
  # gibt keine Werkzeugaufrufe weiter und hakt bei Antworten mit "posted ... twitter" nach (Phantom-Action-Pruefung),
  # was die Rollenbeschreibungen verfaelscht und die Aufrufe verdoppelt. LLM_BASE_URL und LLM_API_KEY kommen aus
  # der Betriebs-.env; fehlen sie, scheitert jeder Aufruf (kein Ausweichen auf OpenFang).
  mirofish_shim:
    type: openai
    base_url: ${LLM_BASE_URL}
    key_ref: mirofish_shim
    max_retries: 1
    timeout_seconds: 280

default:
  provider: openfang
  model: openfang:brain-fallback
  temperature: 0

roles:
  # Abweichung vom zentralen Beispiel (dort openfang:brain-forecaster), siehe Kommentar am Provider mirofish_shim.
  space_mirofish: { provider: mirofish_shim, model: "claude-code-haiku", temperature: 0.2 }

overrides: {}
