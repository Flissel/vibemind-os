[project]
name = "djset"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1,<0.3",
    "scipy>=1.17",
    # >=0.2: djset/agents/client.py benutzt ClaudeAgentOptions,
    # AssistantMessage, TextBlock und ein asynchrones query() - alles
    # 0.2-Oberflaeche. Eine 0.1.x wuerde beim Import scheitern, und kein Test
    # faengt das, weil der echte Client absichtlich nirgends getestet wird.
    # <0.3, weil die naechste Hauptversion dieselbe Frage neu stellt.
    "claude-agent-sdk>=0.2,<0.3",
    # Musik-Dienst (djset/dienst/server.py): MCPServer und custom_route sind 2.x-Oberflaeche
    # (aus FastMCP wurde MCPServer). <3, weil die naechste Hauptversion sie wieder aendern kann.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Gesangsspur (djset/dsp/trennen.py). torch bitte als CPU-Variante vorher
# installieren, sonst zieht pip die CUDA-Variante (2,5 GB) und das Trennen
# konkurriert mit anderen Diensten um die Grafikkarte:
#   pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
gesang = ["torch==2.5.1", "torchaudio==2.5.1", "demucs==4.0.1"]

[project.scripts]
dj-set = "djset.cli:main"
musik-dienst = "djset.dienst.server:main"
musik-telegram = "djset.claw.telegram:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnungen sind hier Fehler. djset/dsp/analyze.py::_load_audio existiert
# einzig deshalb, weil librosa.load unter Python 3.11 DeprecationWarnings aus
# aifc/audioop/sunau ausloest; ohne diese Zeile haengt das an der Erinnerung
# einzelner Leute, pytest mit -W error zu starten. Ein Rueckfall auf
# librosa.load bricht jetzt die Suite, statt still durchzugehen.
filterwarnings = ["error"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
