# marketing-claw Gateway — openclaw vor dem marketing-mcp-Sidecar (P1,
# Spec 2026-09-02). BEWUSST OHNE KANAELE: dieser Agent kann strukturell
# nichts versenden — er kennt nur die MCP-Server marketing (Entwuerfe ->
# Staging + Schaufenster) und rowboat (3 Lesewerkzeuge).
#
# Schluessel (Rowboat-Bearer, Modell-Provider) kommen NIE hierher oder in
# die Saat — anbinden.sh setzt sie ins Laufzeit-Volume (Muster sales-claw).
services:
  marketing-claw:
    image: ghcr.io/openclaw/openclaw:2026.7.1-slim
    container_name: marketing-claw
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      # /home/node gehoert dem node-User des Images — /state gehoerte root,
      # daher der EACCES-Crash beim ersten Versuch (gleiches Layout wie
      # sales-claw: State + Keys unter /home/node).
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
    volumes:
      - marketing-claw-state:/home/node/.openclaw
      - marketing-claw-keys:/home/node/.config/openclaw
      - ./config/workspace:/seed/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Der Image-Healthcheck probt fest 127.0.0.1:18789; unser Gateway bindet
    # loopback:18895 (config/openclaw.json) -> Container stand dauerhaft auf
    # "unhealthy", obwohl der Gateway "ready" war (gemessen 03.09.2026: 18895
    # -> 200, 18789 -> fetch failed). Gleiche Probe, richtiger Port.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18895/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3m
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  marketing-claw-state:
  marketing-claw-keys:
