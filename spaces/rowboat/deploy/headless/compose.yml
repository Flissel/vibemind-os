# Rowboat-Server ohne Oberflaeche auf offload-vm. Liegt dort unter ~/rowboat-headless/ (bauen.ps1).
services:
  rowboat-server:
    build: .
    image: rowboat-headless:local
    # Host-Netz statt Ports: die Host-Pruefung des Servers laesst nur eigene Schnittstellen-IPs
    # zu; im Bridge-Netz fehlt die Tailscale-IP 100.67.177.45 -> 403 "unrecognized Host header".
    network_mode: host
    restart: unless-stopped
    mem_limit: 3g
    # Rowboat fragt das Modell erst an, wenn die Shim gesund antwortet
    depends_on:
      rowboat-shim:
        condition: service_healthy
    environment:
      ROWBOAT_WORKDIR: /data
      ROWBOAT_SERVER_PORT: "3220"
      NODE_OPTIONS: --max-old-space-size=2048
      # Keine Telemetrie vom Mini-PC (core/src/analytics/posthog.ts)
      ROWBOAT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    volumes:
      # Fehlt der Ordner, bricht der Start ab, statt ihn als root anzulegen (Container laeuft als uid 1000).
      - type: bind
        source: /home/debian/rowboat-data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3220/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Claude-Shim (OpenAI-kompatibel) fuer Rowboat, mit Budget-Huelle (Agent rowboat-server, 300/Tag).
  # Host-Netz, damit der Rowboat-Server ihn unter 127.0.0.1:8121 erreicht; er bindet NUR Loopback.
  rowboat-shim:
    build: ./shim
    image: rowboat-shim:local
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    # Datei mit genau einer Zeile CLAUDE_CODE_OAUTH_TOKEN=... (Modus 0600, nie im Repo).
    env_file: ./claude-token
    environment:
      VIBEMIND_AGENT: rowboat-server
      VIBEMIND_BUDGET_DIR: /budget
      SHIM_TOOL_CALLS: "1"
    command: ["python3", "/opt/shim/rowboat_shim_huelle.py", "--host", "127.0.0.1", "--port", "8121"]
    volumes:
      # Zaehldateien des Budgets; fehlt ./budget, startet der Dienst nicht (statt root-Ordner).
      - type: bind
        source: ./budget
        target: /budget
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8121/v1/models', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Bedeutungssuche (Teil C): MCP-Dienst nur auf 127.0.0.1:3240/mcp/, Rowboat traegt ihn in
  # config/mcp.json ein. Liest knowledge/ nur, schreibt nur ./wissen-index. Kein Modell hier:
  # Vektoren rechnet Ollama am PC (tailscale serve 11435); ist der PC aus, sucht er per Stichwort.
  rowboat-wissen:
    build: ./wissen
    image: rowboat-wissen:local
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    # Ein Kern reicht (Vektoren rechnet der PC). Begrenzt auch verwaiste `docker exec`-Prozesse,
    # siehe README "Diagnose im Container" (2026-10-26: 16 Tage Endlos-Glob durch /sys).
    cpus: "1.0"
    user: "1000:1000"
    environment:
      WISSEN_ORDNER: /wissen
      WISSEN_INDEX: /index/wissen.sqlite
      OLLAMA_URL: http://100.84.127.84:11435
      EMBED_MODELL: qwen3-embedding:0.6b
      EMBED_DIM: "1024"
      EMBED_NUM_CTX: "2048"
      INDEX_INTERVALL_S: "600"
      WISSEN_PORT: "3240"
    volumes:
      # Fehlt einer der Ordner, startet der Dienst nicht (statt ihn als root anzulegen).
      - type: bind
        source: /home/debian/rowboat-data/knowledge
        target: /wissen
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./wissen-index
        target: /index
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3240/gesund', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Werkzeuge (Teil D): MCP vibemind-werkzeuge nur auf 127.0.0.1:8150/mcp, alle Werkzeuge nur lesend
  # (GitHub per Nur-Lese-Token, Startprobe sperrt schreibende Tokens; pc_suchen leitet an den PC weiter).
  # Geheimnisse nur in ./werkzeuge.env (0600, rowboat-zugang ueber ssh-stdin) - unsichtbar fuer den
  # Rowboat-Container, in dessen config/mcp.json nur die URL steht. Fehlt die Datei, startet der Dienst
  # trotzdem und meldet "nicht eingerichtet". Kein Volume: sieht nichts von rowboat-data.
  rowboat-werkzeuge:
    build: ./werkzeuge
    image: rowboat-werkzeuge:local
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - path: ./werkzeuge.env
        required: false
    environment:
      WERKZEUGE_PORT: "8150"
      PC_SUCHE_URL: http://100.84.127.84:8149
      GITHUB_BESITZER: Flissel=GITHUB_LESEN_FLISSEL,Vibemind-LAB=GITHUB_LESEN_VIBEMIND_LAB
      # Gitea auf derselben VM (debian-coding-gitea-1, :3002); Token GITEA_LESEN in werkzeuge.env
      GITEA_URL: http://127.0.0.1:3002
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8150/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Auftraege (Konzept-Flaeche Teil B): MCP rowboat-auftraege nur auf 127.0.0.1:8156/mcp mit genau einem Werkzeug,
  # video_auftrag_aus_konzept (Videokonzept aus knowledge/Konzepte -> Sales-Annahme POST /api/auftraege/video).
  # Der Dienst BEREITET NUR VOR: den Auftrag legt Sales erst an, wenn Felix auf der Werkbank-Seite bestaetigt.
  # Jede MCP-Anfrage braucht den Dienstschluessel (./auftraege-zugang, 0600); den Sales-Schluessel liest der Dienst
  # aus ./sales-schluessel (0600). Beide als nur lesende Datei-Mounts ohne create_host_path: fehlt eine Datei, legt
  # compose den Container nicht an; ist sie leer, startet der Dienst nicht. Wissensordner nur lesend.
  # ./auftraege.env traegt AUFTRAEGE_LADEN_ANZEIGE (Pflicht) und SALES_UI_ANZEIGE_URL (optional; dann muessen die
  # Links von Sales genau dorthin zeigen) - beides kein Geheimnis.
  # Profil "auftraege": ein "docker compose up -d" fuer den ganzen Stapel laesst den Dienst aus, damit er nicht an
  # fehlenden Schluesseldateien scheitert. Start nur mit "docker compose --profile auftraege up -d rowboat-auftraege".
  rowboat-auftraege:
    profiles: ["auftraege"]
    build: ./auftraege
    image: rowboat-auftraege:local
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: ./auftraege.env
        required: false
    environment:
      AUFTRAEGE_PORT: "8156"
      WISSEN_ORDNER: /wissen
      SALES_UI_URL: http://127.0.0.1:8791
      AUFTRAEGE_ZUGANG_DATEI: /schluessel/auftraege-zugang
      SALES_SCHLUESSEL_DATEI: /schluessel/sales-schluessel
      AUFTRAEGE_LOG: /log/auftraege.log
    volumes:
      - type: bind
        source: /home/debian/rowboat-data/knowledge
        target: /wissen
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./auftraege-zugang
        target: /schluessel/auftraege-zugang
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./sales-schluessel
        target: /schluessel/sales-schluessel
        read_only: true
        bind:
          create_host_path: false
      # Protokoll auftraege.log (dreht bei 1 MB, drei Vorgaenger); bauen.ps1 legt den Ordner 0700 an.
      - type: bind
        source: ./auftraege-log
        target: /log
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8156/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
