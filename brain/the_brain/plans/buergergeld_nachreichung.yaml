# Brain-Plan-Template: Bürgergeld-Nachreichung
#
# Deklarative Spiegelung von skills/buergergeld/orchestrate.py für den
# Brain multihop_execute Pfad. Wird in Phase 4+ aktiviert wenn der Voice-Layer
# Skills als execution_target aufrufen kann.
#
# Bis dahin ist orchestrate.py die ausführbare Referenz:
#   python skills/buergergeld/orchestrate.py --pdf eingang/<schreiben>.pdf
#
# Schema: siehe brain/the_brain/core/plan_schema.py (HopSpec)

plan_id: buergergeld_nachreichung
intent: "Bürgergeld-Schreiben verarbeiten und Nachreichungs-Antwort vorbereiten"
rationale: >
  Read-Pipeline (parse → abgleich) gefolgt von Generierung (anschreiben → pdf),
  Validierung und einem HUMAN-Approval-Gate vor dem (manuellen) Versand.
final_synthesis_prompt: >
  Fasse zusammen: was gefordert war, was schon erfüllt ist, was nachgereicht
  wird, und welche Warnungen die Validierung ergab. Weise explizit darauf hin,
  dass Felix prüfen und unterschreiben muss und der Versand manuell erfolgt.

hops:
  - step_id: parse
    description: "Behörden-PDF in strukturierte Forderungsliste parsen"
    capability: buergergeld_parse_eingang
    execution_target: "skill:buergergeld/parse-eingang/run.py"
    arg_kwarg: pdf_path
    arg_template: "{{state.eingang_pdf}}"
    output_var: forderungen_yaml
    on_fail: abort

  - step_id: abgleich
    description: "Forderungen mit Akten-Stand abgleichen"
    capability: buergergeld_status_abgleich
    execution_target: "skill:buergergeld/status-abgleich/run.py"
    arg_kwarg: forderungen_yaml
    arg_template: "{{state.forderungen_yaml}}"
    depends_on: [parse]
    output_var: status_report
    on_fail: abort

  - step_id: anschreiben
    description: "Nachreichungs-Anschreiben als docx generieren"
    execution_target: "skill:buergergeld/anschreiben-generator/run.py"
    arg_kwarg: report
    arg_template: "{{state.status_report}}"
    depends_on: [abgleich]
    output_var: anschreiben_docx
    on_fail: abort

  - step_id: sammel_pdf
    description: "Sammel-PDFs für Abschnitte mit offenen Forderungen bauen"
    execution_target: "skill:buergergeld/sammel-pdf-builder/run.py"
    depends_on: [abgleich]
    output_var: sammel_pdfs
    on_fail: continue   # PDF-Fehler blockiert nicht die ganze Pipeline

  - step_id: validate
    description: "Cross-Checks: Konsistenz, Frist, Pflichtfelder"
    execution_target: "skill:buergergeld/validate-antwort/run.py"
    arg_kwarg: report
    arg_template: "{{state.status_report}}"
    depends_on: [anschreiben, sammel_pdf]
    output_var: validation
    on_fail: continue
    validator:
      kind: rule:verdict_not_fail
      on_fail: report

  - step_id: approval_gate
    description: "HUMAN-Gate: Mensch prüft, unterschreibt, lädt manuell hoch"
    execution_target: "human:approval"
    depends_on: [validate]
    output_var: approval
    on_fail: abort
    # Brain pausiert hier. Kein automatischer Versand ans Jobcenter —
    # rechtlich muss Felix prüfen und gegenzeichnen (§§ 60, 66 SGB I).

# Hinweis: step "versand" existiert bewusst NICHT. Der Upload ins
# Jobcenter-Postfach bleibt manuell. openclaw könnte später das Formular
# vorbefüllen, aber der finale Klick gehört dem Menschen.
