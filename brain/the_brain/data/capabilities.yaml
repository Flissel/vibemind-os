# Brain capability registry — Phase 1 (regex routing only).
#
# Each entry is matched in order; first regex hit wins. No regex match →
# router returns None → DiscourseEngine falls back to broadcast (existing
# behavior, unchanged).
#
# All agent names verified live in OpenFang on 2026-05-01:
#     curl http://127.0.0.1:4200/api/agents
#
# Field reference:
#   capability     — short snake_case id, used in trace + stats
#   description    — human readable, also used as semantic-fallback text in Phase 2
#   match_patterns — list of regex strings (case-insensitive)
#   agents.primary — preferred candidates for the dispatch role
#   agents.supporting — additional voices for the discourse round
#   execution_target — Phase 1.5 only; not used by Phase 1 router
#
# Adding a capability: append a new entry, restart Brain. Router validates
# agent names against OpenFang at startup and warns on registry-rot.

- capability: bubble_evaluate
  description: "evaluate a bubble idea readiness for project promotion through 5 expert perspectives, is this idea mature enough is this ready to build, project gate go/no-go assessment, score and missing_items report"
  match_patterns:
    # Use 'evaluate', 'eval', 'assess', 'bewerte' as the lead verbs.
    # Avoid catching 'promote bubble X' / 'create bubble X' which have
    # their own capabilities defined later in this file.
    - "(evaluate|eval|assess|bewerte)\\b.*\\bbubble\\b"
    - "(evaluate|eval|assess|bewerte|prüf|check)\\s+(the|this|my)?\\s*\\b(idea|idee)\\b"
    - "(ready|reif)\\s+(for|für)\\s+(project|umsetzung|production)"
    - "(review|critique)\\s+(my|the|this)?\\s*\\w+(\\.py|\\.ts|\\.js|\\.rs|\\.go)"
    - "design (review|check|critique)"
    - "go.?no.?go"
    - "readiness (check|score|eval)"
  # Phase 1.5: direct execution — bypass discourse, call the existing
  # 5-spaces evaluate_bubble_readiness() function directly. Argument
  # is the bubble name extracted via the regex below.
  execution_target: "direct:spaces.mirofish.tools.mirofish_tools:evaluate_bubble_readiness"
  # Pulls the bubble name out of the intent. Tries quoted form first
  # ("Brain Capability Router"), falls back to "evaluate <name> bubble"
  # word capture between 'evaluate' and 'bubble'.
  result_arg_extractor: 'regex:evaluate\s+(?:the\s+|this\s+|my\s+)?(.+?)\s+bubble'
  # Phase 3 — Validator. Cheap deterministic check that the eval result
  # contains a numeric score in [0,100]. on_fail: report keeps the
  # existing flow (verdict attached, response still returned).
  validator:
    kind: rule:score_in_range
    on_fail: report
  # Feedback loop: after the deterministic eval returns, send result
  # to a small focused agent set for reflective synthesis. Agents
  # answer in I_AGREE/I_DISAGREE/KEY_GAP/NEXT_STEP format which the
  # aggregator turns into a coherent recommendation.
  feedback_loop:
    enabled: true
    agents: [brain-coder, fungus-search, poc-security-scanner, rowboat-knowledge]
    prompt_template: |
      A bubble was just evaluated for project-readiness. Here is the raw output:

      Bubble: {bubble_name}
      Score: {total_score}/100
      Prediction: {prediction}

      Per-perspective scores:
      {per_agent_summary}

      Top missing items ({missing_count} total):
      {missing_items_top10}

      The user's original question was:
      "{original_intent}"

      Reply in this exact format:
      I_AGREE / I_DISAGREE: <one-line stance>
      KEY_GAP: <the single most important missing item from your perspective>
      NEXT_STEP: <one concrete actionable next step the user should take>

- capability: code_search
  description: "find code locate function class method implementation source file, where is X, find me the X, locate where Y is, get code snippets relevant to a topic, search the codebase for patterns or definitions"
  # Phase 2.5 — extra anchor phrases for semantic match (max-cosine across all)
  anchor_phrases:
    - "find me the implementation of a function"
    - "locate where a piece of code is defined"
    - "show me the source for the X module"
    - "where is the auth code"
    - "search the codebase for a function"
  match_patterns:
    - "(where|wo) (is|ist)\\s+(the|der|die|das)?\\s*\\w+"
    - "find (the|all)?\\s*(code|function|class|method)"
    - "show me (the|how)\\s+\\w+"
    - "wie (funktioniert|geht)\\s+\\w+"
    - "code (for|about|that does)\\s+\\w+"
  agents:
    primary: [fungus-search]
    supporting: [brain-coder, rowboat-knowledge]

- capability: security_scan
  description: "scan for vulnerabilities, audit secrets, check security posture"
  anchor_phrases:
    - "check for hardcoded api keys in the repo"
    - "audit the codebase for leaked credentials"
    - "scan for security vulnerabilities"
    - "find exposed secrets"
  match_patterns:
    - "(scan|check|audit) .* (security|vulnerab|secret|cve)"
    - "(audit|review) (the\\s+)?(secret|cred|api.key)"  # covers "audit secrets in this codebase"
    - "(security|vuln|vulnerability) (scan|check|audit|assessment)"
    - "find (vuln|cve|exposed secret)"
    - "ist .* (sicher|sicherheit)"
  agents:
    primary: [poc-security-scanner, poc-vuln-scanner]
    supporting: [poc-secret-vault, poc-forensics, poc-red-blue]

- capability: incident_response
  description: "diagnose contain mitigate a security or ops incident, server unreachable api endpoint throwing 500 errors pages loading slowly users impacted, outage triage on-call investigate alert"
  anchor_phrases:
    - "the api endpoint is throwing 500 errors"
    - "server is unreachable for users"
    - "production is down"
    - "users are impacted by an outage"
    - "investigate this alert"
  match_patterns:
    - "(security|prod|outage)\\s+(incident|alarm|issue|alert)"
    - "etwas ist\\s+(kaputt|down|defekt)"
    - "system\\s+(is\\s+down|crashed|hung)"
    - "investigate\\s+(the|this)?\\s*(alert|incident)"
    - "(suspicious|verdächtig)\\s+\\w+"
  agents:
    primary: [poc-alerter, poc-forensics]
    supporting: [poc-log-analyzer, sensor-monitor, poc-vuln-scanner]

- capability: log_analysis
  description: "examine log files diagnose failures find error patterns stack traces crashes what happened what went wrong root-cause an incident from log output debug application crashes from traces"
  match_patterns:
    - "(analy[sz]e|parse|search)\\s+(the|my|some)?\\s*\\w*\\.log"
    - "(analy[sz]e|parse|search)\\s+(the|my|some)?\\s*log"
    - "log\\s+(analy|search|grep)"
    - "what happened in (the)?\\s*log"
    - "errors? (in|aus)\\s+\\S*\\.?log"
  agents:
    primary: [poc-log-analyzer]
    supporting: [poc-forensics, sensor-monitor]

- capability: knowledge_query
  description: "answer factual question from project knowledge, count of agents items registered, list things, breakdown of agents personas bubbles tools, who-what-where-how-many lookup, query the knowledge graph for facts and statistics"
  anchor_phrases:
    - "count of agents currently registered"
    - "how many bubbles do we have"
    - "list all the personas"
    - "who is the lead developer"
    - "give me the statistics"
  match_patterns:
    # Restricted to Vibemind-domain nouns — `what is X` for off-domain
    # entities (e.g. "what is the capital of france") should fall through
    # to no-match, not be answered as a knowledge query.
    #
    # Phase 11.N: bubble/idea/idee removed from "wie viele/list/show me"
    # patterns — these now route to bubble_stats / idea_count / bubble_list
    # / idea_list capabilities respectively (more specific dispatch).
    - "wie viele (agents|tools|personas|spaces|projekte|topics)"
    - "how many (agents|tools|personas|spaces|projects|topics)"
    - "what (is|are)\\s+(?:the\\s+)?(agent|tool|persona|space|project|topic|capability|router|brain|mirofish|openfang|fungus|discourse)\\b"
    - "(was ist|wer ist|wo ist)\\s+(?:der|die|das)?\\s*(agent|brain|tool|persona|space|projekt|router|capability)"
    # `wer ist <ProperName>` — capitalised name → assume it's a person we know
    - "wer ist\\s+[A-ZÄÖÜ]\\w+"
    - "list (the|all)?\\s*(agent|tool|persona|space|project|topic|capability)"
    - "show me (all|the)?\\s*(agent|tool|persona|space|project|topic)"
  agents:
    primary: [rowboat-knowledge, supermemory]
    supporting: [fungus-search]

- capability: email_action
  description: "compose send personalise route an email, draft a message, follow-up note, write to team, reply to incoming mail, email automation"
  anchor_phrases:
    - "compose a follow-up message"
    - "draft an email to the team"
    - "write a reply to a mail"
    - "send a notification message"
  match_patterns:
    - "(send|write|compose|schick) (an|eine)?\\s*(e?mail|nachricht)"
    - "(reply to|antwort auf)\\s+\\w+"
    - "email (to|an)\\s+\\w+"
  agents:
    primary: [poc-email-response, poc-email-sender]
    supporting: [poc-email-personalizer, poc-email-verteiler]

- capability: site_check
  description: "verify website service endpoint url is up reachable online responding healthy ping URL availability check"
  match_patterns:
    # Tighten — `.*` was too greedy and caught "check for hardcoded api keys".
    # Require the keywords adjacent OR with at most a determiner between them.
    - "(check|verify|test)\\s+(?:if\\s+)?(?:the\\s+|this\\s+|that\\s+|a\\s+)?(site|url|website|page|endpoint|api|service)\\b"
    - "(check|verify|test) (if )?\\w+ (is|are)\\s+(up|reachable|online|verfügbar|down|healthy)"
    # Allow domain-name characters (dots, dashes) in `is X up`
    - "(is|ist)\\s+[\\w.\\-:/]+\\s+(up|reachable|online|verfügbar|down|healthy)"
    - "site\\s+(verifier|check)"
  agents:
    primary: [poc-site-verifier]
    supporting: [sensor-monitor]

- capability: chitchat
  description: "casual greetings hi hallo hey hello good morning good evening guten tag, polite small talk how are you how have you been today how is it going, identity questions like who are you what are you tell me about yourself"
  anchor_phrases:
    - "good morning"
    - "good evening"
    - "how have you been today"
    - "how are things"
    - "tell me about yourself"
  match_patterns:
    - "^(hi|hallo|hey|hello|moin)\\b"
    - "wie geht('s| es dir)"
    - "what (are|r) (you|u)\\s*"
    - "wer bist du"
  agents:
    primary: [assistant]
    supporting: []

# ─── Direct-execution capabilities for the bubble lifecycle ────────────
# These wrap the existing voice-tool API (params dict) — Brain extracts
# the bubble title from the intent, wraps as {title: <name>}, and the
# tool returns its usual confirmation string.

- capability: bubble_create
  description: "create a new bubble space topic project with a title (NOT individual ideas/notes — those go via idea_add)"
  match_patterns:
    # Only bubble/space/topic — 'idea/note' is owned by idea_add (defined later
    # but we exclude it here to keep first-match ordering safe regardless).
    - "create (a |an |new )?(bubble|space|topic)\\b"
    - "(make|new) (a |an )?(bubble|space|topic)"
    - "(neue|erstelle eine?) (bubble|space|thema)"
  execution_target: "direct:spaces.ideas.tools.bubble_tools:create_bubble"
  result_arg_extractor: 'regex:(?:create|make|new|erstelle|neue)\s+(?:a\s+|an\s+|new\s+|eine?\s+)?(?:bubble|space|topic|thema)\s+(?:called\s+|named\s+|für\s+|with title\s+|titled\s+)?[''"]?([^''"]+?)[''"]?$'
  arg_kwarg: title
  validator:
    kind: rule:bubble_id_present
    on_fail: report

- capability: bubble_promote
  description: "promote a bubble to a project, advance lifecycle from idea to actual project"
  match_patterns:
    - "promote\\s+(?:the\\s+|this\\s+|my\\s+)?(?:bubble|idea)\\s+\\w+"
    - "befördere\\s+(?:die\\s+|diese\\s+)?(?:bubble|idee)"
    - "(?:bubble|idea)\\s+\\w+\\s+to\\s+project"
  execution_target: "direct:spaces.ideas.tools.bubble_tools:promote_bubble"
  result_arg_extractor: 'regex:promote\s+(?:the\s+|this\s+|my\s+)?(?:bubble|idea)\s+([^\n]+)'
  arg_kwarg: bubble_name

- capability: bubble_score
  description: "score or rate a bubble across impact feasibility novelty urgency dimensions, how mature/ready/reif is a bubble, give me the score, wie reif"
  anchor_phrases:
    - "score the bubble"
    - "rate the bubble"
    - "wie reif ist die bubble"
    - "wie gut ist die bubble"
    - "wie weit ist die bubble"
  match_patterns:
    - "score\\s+(?:the\\s+|this\\s+|my\\s+)?(?:bubble|idea)"
    - "rate\\s+(?:the\\s+|this\\s+|my\\s+)?(?:bubble|idea)"
    - "wie\\s+(gut|reif|weit|fortgeschritten)\\s+ist\\s+(?:die|diese|meine)\\s+bubble"
    - "(maturity|readiness)\\s+(?:of\\s+)?(?:the\\s+)?bubble"
  execution_target: "direct:spaces.ideas.tools.bubble_tools:score_bubble"
  # Try multiple extractors in priority order: explicit name, then bare bubble word
  result_arg_extractor: 'regex:(?:bubble|idea|StressBubble)\s+([\w\d\s\-]+?)(?:\s+(?:we|that|which|bubble))?$'
  arg_kwarg: bubble_name

- capability: idea_add
  description: "add a note or idea to the current bubble, capture a thought, write down a thought jot down a memo, append a sub-idea to the active space"
  anchor_phrases:
    - "write down a thought about something"
    - "write down a thought about cache strategy"
    - "capture an idea about a topic"
    - "jot down a quick note"
    - "add a sub-idea to this bubble"
    - "save this thought"
    - "remember this idea about caching"
  match_patterns:
    - "(add|create|note)\\s+(?:a |an )?(?:note|idea|thought)\\s+"
    - "(add|create)\\s+\\w+\\s+(?:to|in)\\s+(?:the\\s+)?(?:current\\s+)?(?:bubble|space)"
    - "(notiere|halte fest|merke)\\s+"
  execution_target: "direct:spaces.ideas.tools.idea_tools:create_idea"
  result_arg_extractor: 'regex:(?:add|create|note|notiere)\s+(?:a |an |an idea )?(?:note|idea|thought)?\s*(?:about|that|für)?\s*[''"]?([^''"\n]+?)[''"]?$'
  arg_kwarg: title
  validator:
    kind: rule:idea_created
    on_fail: report

# ─── Phase 11.H — Idea content-validation capabilities ─────────────────
# These give the plan-generator access to the rich idea_tools.py functions
# beyond plain creation: AI-tree-search expansion, classification,
# semantic connections, formatting, explanation. Makes plans like
# "expand each idea with sub-ideas" / "classify each idea" actually work.

- capability: idea_expand
  description: "expand an idea into sub-ideas using AI-Scientist tree-search, generate child ideas from a parent, deepen an idea with sub-points, brainstorm beneath an idea, derive related ideas tree-style"
  anchor_phrases:
    - "expand this idea into sub-ideas"
    - "generate sub-ideas under this one"
    - "deepen the idea with related sub-points"
    - "brainstorm beneath this idea"
    - "tree-search expansion of this idea"
  match_patterns:
    - "expand\\s+(?:the\\s+|this\\s+|each\\s+|every\\s+)?(idea|node|note)"
    - "generate\\s+sub[-\\s]?ideas?"
    - "deepen\\s+(?:the\\s+|this\\s+)?idea"
    - "(?:expandiere|vertiefe|erweitere)\\s+(?:die\\s+|jede\\s+)?idee"
  execution_target: "direct:spaces.ideas.tools.idea_tools:expand_ideas"
  arg_kwarg: idea_id
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_classify
  description: "classify an idea by category, tag it taxonomically, assign a topic class, label the idea, categorize the note"
  anchor_phrases:
    - "classify this idea"
    - "tag the idea with categories"
    - "label this note with a topic"
    - "categorize each idea"
  match_patterns:
    - "(classify|categorize|tag|label)\\s+(?:the\\s+|this\\s+|each\\s+|every\\s+)?(idea|note|thought)"
    - "(klassifiziere|kategorisiere|tagge|labele)\\s+(?:die\\s+|jede\\s+)?(idee|notiz)"
  execution_target: "direct:spaces.ideas.tools.idea_tools:classify_idea"
  arg_kwarg: idea_id
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_connect
  description: "connect two ideas via a relation, link related ideas, draw an edge between two notes, create a connection edge in the idea graph"
  anchor_phrases:
    - "connect these two ideas"
    - "link the related ideas"
    - "draw an edge between A and B"
    - "create a connection between two ideas"
  match_patterns:
    - "(connect|link)\\s+(?:these\\s+|the\\s+)?(?:two\\s+)?ideas?"
    - "(verbinde|verknüpfe|linke)\\s+(?:die\\s+|zwei\\s+)?ideen"
  execution_target: "supabase:idea.connect"  # Phase 11.U.C.10
  arg_kwarg: idea1  # primary; idea2 re-extracted from _intent
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_explain
  description: "explain an idea in natural language with context, give a written description of the idea, narrate what an idea means, elaborate on a note"
  anchor_phrases:
    - "explain this idea in detail"
    - "describe what this idea means"
    - "elaborate on this note"
    - "give a written explanation of the idea"
  match_patterns:
    - "(explain|describe|elaborate)\\s+(?:on\\s+)?(?:the\\s+|this\\s+|each\\s+|me\\s+)?ide[ea]n?"
    - "(erkl(ä|ae)re|erkl(ä|ae)r|beschreibe|elaboriere)\\s+(?:die\\s+|jede\\s+|mir\\s+)?ide[ea]n?"
    - "what\\s+(?:does|is)\\s+(?:the\\s+)?ide[ea]\\s+(?:mean|about)"
  execution_target: "direct:spaces.ideas.tools.idea_tools:explain_idea"
  arg_kwarg: idea_id
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_format_table
  description: "render an idea as a comparison table, format ideas in a table with columns like pros cons specs, create a table view of the bubble"
  anchor_phrases:
    - "format this idea as a table"
    - "render the bubble as a table"
    - "create a comparison table"
    - "format ideas with pros and cons table"
  match_patterns:
    - "(format|render|stelle\\s+dar)\\s+(?:as\\s+|als\\s+)?(table|tabelle|comparison)"
    - "compare\\s+(?:the\\s+)?ideas"
  execution_target: "direct:spaces.ideas.tools.format_dispatcher:format_idea_table"
  arg_kwarg: idea_name
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_format_note
  description: "format an idea as a simple note, revert structured idea back to plain text"
  anchor_phrases:
    - "back to a note"
    - "revert to note"
    - "mach es wieder zu Text"
  match_patterns:
    - "(als|to)\\s+(notiz|note|text)"
    - "zurueck\\s+zur\\s+notiz"
  execution_target: "direct:spaces.ideas.tools.format_dispatcher:format_idea_note"
  arg_kwarg: idea_name
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_format_action_list
  description: "format an idea as an action list / task checklist with todos"
  anchor_phrases:
    - "make a task list"
    - "as an action list"
    - "mach eine aufgabenliste"
    - "als todos"
  match_patterns:
    - "(als|as)\\s+(action[-\\s]?list|aufgabenliste|task[-\\s]?list|todos|tasks)"
    - "(mache?|create)\\s+(?:eine?\\s+)?aufgabenliste"
  execution_target: "direct:spaces.ideas.tools.format_dispatcher:format_idea_action_list"
  arg_kwarg: idea_name
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_format_pros_cons
  description: "format an idea as a pros and cons list, vor- und nachteile, advantages disadvantages"
  anchor_phrases:
    - "pros and cons"
    - "vorteile und nachteile"
    - "pro contra liste"
  match_patterns:
    - "pros?\\s*[-/]?\\s*cons?"
    - "vor[-\\s]?(?:und[-\\s]?)?nach(?:teile)?"
    - "(pro|vor)[-\\s]?(contra|nach)"
  execution_target: "direct:spaces.ideas.tools.format_dispatcher:format_idea_pros_cons"
  arg_kwarg: idea_name
  validator:
    kind: rule:string_nonempty
    on_fail: report

- capability: idea_format_hierarchy
  description: "format an idea as a hierarchy or outline structure"
  anchor_phrases:
    - "as an outline"
    - "structure as hierarchy"
    - "als gliederung"
  match_patterns:
