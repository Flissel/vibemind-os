- capability: idea_analyze_links
  description: "analyze existing connections in a bubble and suggest improvements, find missing links, recommend new edges, link analysis report (read-only — does NOT auto-create like idea_auto_link)"
  anchor_phrases:
    - "analyze the connections between ideas"
    - "analyze the existing links"
    - "suggest new links between ideas"
    - "untersuche die verbindungen"
    - "analysiere die verbindungen zwischen den ideen"
    - "link analyse report"
    - "schlage neue verbindungen vor"
  match_patterns:
    # Stricter than idea_auto_link: requires the analyze/untersuche verb
    # AND a connections/verbindungen object. Plus optional "zwischen" /
    # "between" that disambiguates from auto-link (which uses "verbinde").
    - "(analy(s|z)e|analyz(e|ier)|untersuche|inspect|review)\\s+(?:the\\s+|die\\s+|alle\\s+)?(connections?|links?|verbindungen|edges?)"
    - "(suggest|empfehle?|vorschla[gn]e?|schlage?\\s+vor)\\s+(?:new\\s+|weitere\\s+|zusaetzliche\\s+|neue\\s+)(connections?|links?|verbindungen|edges?)"
