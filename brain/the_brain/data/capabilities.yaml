# ─── Broadcast capabilities (no execution_target — Phase 1 narrowing) ──
# These run the standard discourse round but to a small focused agent set
# instead of broadcasting to all 25.

- capability: code_review
  description: "review code diff pull request changes for bugs style security tests quality"
  match_patterns:
    - "(review|check|critique)\\s+(?:my\\s+|the\\s+|this\\s+)?(?:code|diff|pr|pull request|change)"
    - "code review\\b"
    - "ist (?:das|der code|mein code)\\s+(?:okay|gut|sicher|sauber)"
    - "look (?:at|over)\\s+(?:my\\s+|the\\s+)?code"
  agents:
    primary: [brain-coder, fungus-search]
    supporting: [poc-security-scanner, rowboat-knowledge]
  # When agents respond, aggregator gets a structured prompt asking each
  # for AGREE/DISAGREE + KEY_GAP + NEXT_STEP. Different from the broadcast
  # default ("each propose your own answer") — here the supporting agents
  # are explicitly asked to evaluate the primary's suggestion.
  # Note: feedback_loop on broadcast capabilities is a Phase 2.5 plan;
  # current DiscourseEngine only honors feedback_loop for direct-execution
  # capabilities. This block is documented forward-compat.
  feedback_loop:
    enabled: false  # Phase 2.5 — not wired for broadcast yet
    pattern: proposer_evaluator
    proposer: [brain-coder]
    evaluators: [fungus-search, poc-security-scanner, rowboat-knowledge]

- capability: architecture_question
  description: "explain architecture how does X work understand a system component design decision, walk me through the pipeline routing flow, describe relationship between brain openfang mirofish components, what is the role of, give me an overview"
  anchor_phrases:
    - "walk me through the routing pipeline"
    - "describe the relationship between brain and openfang"
    - "explain how the discourse engine works"
    - "what is the role of fungus search"
    - "give me an overview of the architecture"
  match_patterns:
    # Be strict — require Vibemind/Brain domain words to avoid catching
    # general "how does X work" off-domain queries (e.g. "how does cooking work").
    - "(how|wie)\\s+(?:does|do|is|are|funktioniert)\\s+(?:the\\s+|der\\s+|die\\s+|das\\s+)?(brain|mirofish|openfang|fungus|capability|router|discourse|agent|bubble|tribe|pipeline|architecture|system)"
    - "(explain|erklär|erkläre)\\s+(?:the\\s+|how\\s+|wie\\s+)?(brain|mirofish|openfang|fungus|capability|router|discourse|agent|bubble|architecture|system|pipeline)"
    - "(architecture|architektur) (of|für|von)"
  agents:
    primary: [fungus-search, brain-coder]
    supporting: [rowboat-knowledge]

